version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: ipmanagement-postgres-dev
    environment:
      POSTGRES_DB: IPManagementDB
      POSTGRES_USER: ipmanagement
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - ipmanagement-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ipmanagement -d IPManagementDB"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API - Development mode
  api:
    build:
      context: .
      dockerfile: IPManagement.API/Dockerfile
    container_name: ipmanagement-api-dev
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=IPManagementDB;Username=ipmanagement;Password=${DB_PASSWORD:-postgres}"
      JwtSettings__SecretKey: ${JWT_SECRET_KEY:-your-256-bit-secret-key-must-be-long-enough-for-security}
      JwtSettings__Issuer: IPManagementAPI
      JwtSettings__Audience: IPManagementClient
      JwtSettings__AccessTokenExpirationMinutes: 60
      JwtSettings__RefreshTokenExpirationDays: 7
    ports:
      - "5001:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ipmanagement-network
    restart: unless-stopped

  # Frontend - Development mode (uses .env)
  frontend:
    build:
      context: ./IPManagement.Web
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=http://localhost:5001/api
    container_name: ipmanagement-frontend-dev
    ports:
      - "5173:80"
    depends_on:
      - api
    networks:
      - ipmanagement-network
    restart: unless-stopped

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: ipmanagement-nginx-dev
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - api
    networks:
      - ipmanagement-network
    restart: unless-stopped

networks:
  ipmanagement-network:
    driver: bridge

volumes:
  postgres_data_dev: